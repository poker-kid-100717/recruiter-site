name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: npm ci
      - name: resume.html is generated from content/resume.json
        run: node ../scripts/build-resume.mjs --check
      - run: npm run build
      - name: Verify CSP-safe stylesheet link
        shell: bash
        run: |
          set -euo pipefail
          INDEX="dist/portfolio/browser/index.html"
          grep -qE '<link[^>]+rel="stylesheet"[^>]+href="[^"]+\.css"' "$INDEX"
          if grep -qE '<link[^>]+rel="stylesheet"[^>]+media="print"[^>]+onload=' "$INDEX"; then
            echo "Angular emitted a CSP-incompatible deferred stylesheet loader."
            cat "$INDEX"
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npx wrangler deploy --dry-run

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio-ci@127.0.0.1:5432/portfolio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - name: Migrate, seed, and verify the database (twice, to prove both are idempotent)
        run: |
          npm ci --prefix db
          node db/migrate.mjs
          node db/seed.mjs
          node db/verify.mjs --fresh
          node db/migrate.mjs
          node db/seed.mjs
          node db/verify.mjs --fresh
      - run: dotnet restore
        working-directory: backend
      - run: dotnet build --configuration Release --no-restore
        working-directory: backend
      - name: Worker and .NET API serve identical content from the same database
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend
          (cd backend && ASPNETCORE_URLS=http://127.0.0.1:5088 dotnet bin/Release/net10.0/Portfolio.Api.dll > api.log 2>&1 &)
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5088/health > /dev/null && break
            sleep 1
          done
          node scripts/check-api-content.mjs http://127.0.0.1:5088 || { cat backend/api.log; exit 1; }

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config
      - run: docker compose build
      - name: Full local stack answers from Postgres
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/api/portfolio | grep -q '"headline":"Full-Stack Software Engineer'
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<app-root'
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
