version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    ignore:
      # Angular's compiler pins TypeScript to a minor range; take TypeScript majors with the Angular upgrade.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule: { interval: "weekly" }
    groups:
      backend:
        patterns: ["*"]
