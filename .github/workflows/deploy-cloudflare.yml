name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-cloudflare-production
  # Never cancel a deploy that is mid-migration; the next push waits instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: npm ci
      - name: resume.html is generated from content/resume.json
        run: node ../scripts/build-resume.mjs --check
      - run: npm run build
      - name: Verify CSP-safe stylesheet link
        shell: bash
        run: |
          set -euo pipefail
          INDEX="dist/portfolio/browser/index.html"
          grep -qE '<link[^>]+rel="stylesheet"[^>]+href="[^"]+\.css"' "$INDEX"
          if grep -qE '<link[^>]+rel="stylesheet"[^>]+media="print"[^>]+onload=' "$INDEX"; then
            echo "Angular emitted a CSP-incompatible deferred stylesheet loader."
            cat "$INDEX"
            exit 1
          fi
      - name: Migrate and seed the Neon database
        if: env.DATABASE_URL != ''
        working-directory: .
        env:
          # Schema changes and seeding run as the owner over a direct (non-pooled) connection;
          # the Worker itself only gets the read-only role in WORKER_DATABASE_URL.
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED || secrets.WORKER_DATABASE_URL }}
        run: |
          npm ci --prefix db
          node db/migrate.mjs
          node db/seed.mjs
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
          # Uploaded as the Worker secret DATABASE_URL once WORKER_DATABASE_URL exists; until then the
          # Worker serves the bundled content/*.json seed and /health reports "Degraded".
          secrets: ${{ env.DATABASE_URL != '' && 'DATABASE_URL' || '' }}
      # The Worker logs why it fell back to the seed only in Cloudflare; tail it during the checks so a
      # failed database connection shows its reason in this job. Started first because the result is
      # cached per isolate, so the first request is the one that tries the database.
      - name: Start Worker log tail
        if: env.DATABASE_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          nohup npx wrangler tail --format json > "$RUNNER_TEMP/worker-tail.json" 2> "$RUNNER_TEMP/worker-tail.err" &
          sleep 10
      - name: Verify production site and stylesheet
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://portfolio-joshdavis.app"

          HTML=""
          for attempt in 1 2 3 4 5 6; do
            HTML="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$SITE/?deploy_check=$GITHUB_SHA")"
            if ! printf '%s' "$HTML" | grep -qE '<link[^>]+rel="stylesheet"[^>]+media="print"[^>]+onload='; then
              break
            fi
            echo "Production HTML is still stale on attempt $attempt; retrying..."
            sleep 5
          done

          if printf '%s' "$HTML" | grep -qE '<link[^>]+rel="stylesheet"[^>]+media="print"[^>]+onload='; then
            echo "Production HTML still contains a CSP-incompatible deferred stylesheet loader."
            exit 1
          fi

          CSS_PATH="$(printf '%s' "$HTML" | grep -oE 'href="[^"]+\.css"' | head -n 1 | cut -d '"' -f 2)"

          if [ -z "$CSS_PATH" ]; then
            echo "No stylesheet link found in production HTML."
            exit 1
          fi

          case "$CSS_PATH" in
            http://*|https://*) CSS_URL="$CSS_PATH" ;;
            /*) CSS_URL="$SITE$CSS_PATH" ;;
            *) CSS_URL="$SITE/$CSS_PATH" ;;
          esac

          HEADERS_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' -D "$HEADERS_FILE" -o "$BODY_FILE" "$CSS_URL"

          echo "Production stylesheet: $CSS_URL"
          grep -i '^content-type:' "$HEADERS_FILE"

          if ! grep -qi '^content-type:.*text/css' "$HEADERS_FILE"; then
            echo "Production stylesheet did not return a CSS content type."
            head -c 300 "$BODY_FILE" || true
            exit 1
          fi

          if [ "$(wc -c < "$BODY_FILE")" -lt 1000 ]; then
            echo "Production stylesheet is unexpectedly small."
            exit 1
          fi

          curl --fail --silent --show-error "$SITE/api/profile" | grep -q '"name":"Joshua Davis"'

          HEALTH="$(curl --fail --silent --show-error "$SITE/health")"
          echo "Health: $HEALTH"
          if [ -n "${DATABASE_URL:-}" ]; then
            printf '%s' "$HEALTH" | grep -q '"database":"ok"'
          fi
          curl --fail --silent --show-error --head "$SITE/api/portfolio" | grep -i '^x-content-source:'
      - name: Report Worker database errors
        if: always() && env.DATABASE_URL != ''
        run: |
          sleep 3
          pkill -f 'wrangler tail' || true
          ERRORS="$(jq -r '(.logs[]?.message[]? | tostring | select(contains("portfolio_document_failed"))), (.exceptions[]? | "exception: \(.name): \(.message)")' "$RUNNER_TEMP/worker-tail.json" 2>/dev/null || true)"
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
          else
            echo "No database errors logged by the Worker during the checks."
            head -c 500 "$RUNNER_TEMP/worker-tail.err" || true
          fi
