<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joshua Davis | Full-Stack Software Engineer Resume</title>
  <meta name="robots" content="index,follow">
  <meta name="description" content="Joshua Davis - Full-Stack Software Engineer specializing in C#/.NET, Angular/React, Azure/AWS, SQL Server, enterprise applications, modernization, and production delivery.">
  <link rel="canonical" href="https://portfolio-joshdavis.app/resume.html">
  <style>
    :root{--ink:#111827;--muted:#5f6b7a;--brand:#245f73;--line:#d8dee8;--soft:#f5f7fa}
    *{box-sizing:border-box}
    html{background:#eef2f7}
    body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.36}
    .toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:12px;background:rgba(17,24,39,.96)}
    .toolbar a,.toolbar button{border:0;border-radius:8px;padding:9px 13px;font:700 13px Arial;text-decoration:none;cursor:pointer}
    .toolbar a{background:#fff;color:var(--ink)}
    .toolbar button{background:var(--brand);color:#fff}
    .page{width:min(8.5in,calc(100% - 24px));margin:24px auto;background:#fff;box-shadow:0 18px 55px rgba(15,23,42,.12);padding:.45in .55in}
    .header{text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px}
    .header h1{margin:0;font-size:27px;letter-spacing:.04em}
    .headline{margin:4px 0 5px;color:var(--brand);font-size:12.5px;font-weight:700}
    .contact{font-size:10.5px;color:var(--muted)}
    .contact a{color:inherit;text-decoration:none}
    h2{margin:13px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line);color:var(--brand);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
    p{margin:0}
    .summary{font-size:10.7px}
    .impact{margin-top:8px;padding:7px 9px;background:var(--soft);border-left:3px solid var(--brand);font-size:10.1px}
    .impact strong{color:var(--brand)}
    .skills{display:grid;grid-template-columns:1.1fr 4fr;gap:4px 10px;font-size:10px}
    .skills strong{font-size:10px}
    .skills span{color:var(--muted)}
    .role{margin-top:8px;break-inside:avoid}
    .role-head{display:flex;justify-content:space-between;gap:18px;align-items:baseline}
    .role h3{margin:0;font-size:11.5px}
    .dates{font-size:9.7px;color:var(--muted);font-weight:700;white-space:nowrap}
    .title{margin:1px 0 3px;color:var(--muted);font-size:10px;font-weight:700}
    ul{margin:3px 0 0;padding-left:16px}
    li{margin:1.5px 0;font-size:9.8px}
    .education{font-size:10.3px}
    @media(max-width:680px){
      .page{padding:24px 18px}
      .skills{grid-template-columns:1fr}
      .role-head{flex-direction:column;align-items:flex-start;gap:0}
    }
    @media print{
      html,body{background:#fff}
      .toolbar{display:none}
      .page{width:auto;margin:0;box-shadow:none;padding:.38in .48in}
      @page{size:Letter;margin:0}
    }
  </style>
  <script src="/resume-print.js" defer></script>
</head>
