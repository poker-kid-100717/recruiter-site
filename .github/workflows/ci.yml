name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: npm ci
      - run: npm run build
      - name: Verify CSP-safe stylesheet link
        shell: bash
        run: |
          set -euo pipefail
          INDEX="dist/portfolio/browser/index.html"
          grep -qE '<link[^>]+rel="stylesheet"[^>]+href="[^"]+\.css"' "$INDEX"
          if grep -qE '<link[^>]+rel="stylesheet"[^>]+media="print"[^>]+onload=' "$INDEX"; then
            echo "Angular emitted a CSP-incompatible deferred stylesheet loader."
            cat "$INDEX"
            exit 1
          fi
      - run: npm audit --audit-level=high
      - run: npx wrangler deploy --dry-run

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - name: Worker and .NET API serve the same content/api.json
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_URLS=http://127.0.0.1:5088 dotnet bin/Release/net10.0/Portfolio.Api.dll > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:5088/health > /dev/null && break
            sleep 1
          done
          node ../scripts/check-api-content.mjs http://127.0.0.1:5088 || { cat api.log; exit 1; }

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config
      - run: docker compose build
